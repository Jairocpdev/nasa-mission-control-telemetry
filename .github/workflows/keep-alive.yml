name: Keep SAT-01 Alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s https://nasa-mission-control-api-vpn1.onrender.com/health
      - run: curl -s https://nasa-mission-control-api-vpn1.onrender.com/telemetry/latest | head -c 100
