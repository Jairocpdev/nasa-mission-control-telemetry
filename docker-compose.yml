version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  ingestor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.ingestor
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      # DATABASE_URL vem do .env (Supabase)

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - ingestor
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379

  satellite:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python simulator/satellite.py
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped